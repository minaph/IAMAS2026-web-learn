<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart</title>
</head>
<body>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
            margin: 0;
        }
    
        .chart-row {
            display: flex;
            align-items: center;
        }
    
        .bar {
            width: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 16px;
        }
    
        .bar-a {
            height: 200px; 
            background-color: red;
        }
    
        .bar-b {
            height: 140px;
            background-color: blue; 
        }

        .hr-container {
            width: 50px;
        }

        hr {
            border: none;
            border-top: 2px solid black;
        }
    
        .country {
            margin-left: 10px; 
            font-size: 14px;
            color: black;
            display: flex;
            align-items: center; 
        }
    
    </style>

<div class="chart-container">
    
    <div class="chart-row">
        <div class="bar bar-a">A</div>
        <div class="hr-container"><hr></div>
        <div class="label">アメリカ</div>
    </div>

    <div class="chart-row">
        <div class="bar bar-b">B</div>
        <div class="hr-container"><hr></div>
        <div class="label">日本</div>
    </div>

</div>

</body>
</html>
